# Signal generation thresholds
thresholds:
  no_bias_fade:
    min_no_usd: 50000.0
    min_wallets: 5
  
  concentrated_follow:
    min_yes_usd: 150000.0
    min_wallets: 2
    min_yes_ratio: 0.15
  
  manipulation_fade:
    min_wallets: 10
    max_avg_bet_usd: 400.0

# API configuration
api:
  data_api_base: "https://data-api.polymarket.com"
  trades_limit: 100
  request_timeout: 15
  positions_endpoint: "/positions"
  trades_endpoint: "/v1/trades"

# LLM configuration
llm:
  url: "http://localhost:8080/v1/chat/completions"
  model: "Qwen3.6-35B-A3B"
  timeout: 300
  fallback_strategy: "rule-based"  # When LLM unavailable

# Output paths
paths:
  research_dir: "research"
  positions_file: "sybil_positions.json"
  signals_file: "sybil_signal_queue.json"
  intelligence_file: "sybil_intelligence.json"
  llm_strategy_file: "sybil_llm_strategy.json"
  entity_clusters_file: "entity_clusters.json"